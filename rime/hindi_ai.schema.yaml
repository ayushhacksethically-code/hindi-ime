schema:
  schema_id: hindi_ai
  name: "Hindi AI Phonetic Engine"
  version: "6.0"
  description: "Rime Engine with Single Space Commit + Space Insert Feature"

switches:
  - name: ascii_mode
    reset: 0
    states: [ हिंदी, English ]
  - name: full_shape
    reset: 0
    states: [ 半角, 全角 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - echo_translator
  filters:
    - uniquifier

speller:
  alphabet: zabcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ_.~;^,'
  delimiter: " '"
  auto_select: false
  algebra:
    - derive/^([a-z]+)$/\L$1/
    # QWERTY double-vowel IAST transliteration support
    - derive/aa/a/
    - derive/ee/i/
    - derive/oo/u/
    - derive/([a-z]+)ee$/$1i/
    - derive/([a-z]+)oo$/$1u/
    # Retroflex / Sibilant / Nasal QWERTY shortcuts
    - derive/sh/s/
    - derive/s/sh/
    - derive/gy/jn/
    - derive/ksh/x/
    - derive/x/ksh/

punctuator:
  full_shape:
    ' ': { commit: ' ' }
  half_shape:
    ' ': { commit: ' ' }

key_binder:
  bindings:
    - { accept: space, send_sequence: "1 ", when: has_menu }
    - { accept: space, send: space, when: composing }

translator:
  dictionary: hindi_ai
  enable_user_dict: true
  enable_completion: true
  enable_sentence: true
